include /etc/nginx/modules-enabled/*.conf;

worker_processes auto;
pid /tmp/exchange-nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/exchange-nginx/client_temp;
    proxy_temp_path /tmp/exchange-nginx/proxy_temp;
    fastcgi_temp_path /tmp/exchange-nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/exchange-nginx/uwsgi_temp;
    scgi_temp_path /tmp/exchange-nginx/scgi_temp;

    # Keep upload limits owned by the Rust application instead of Nginx's 1 MiB default.
    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream exchange_api {
        server 127.0.0.1:8081;
    }

    server {
        listen 0.0.0.0:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location = /health {
            proxy_pass http://exchange_api;
        }

        location ~ ^/(?:api/v1|admin/api/v1|agent/api/v1)(?:/|$) {
            proxy_pass http://exchange_api;
        }

        location ~ ^/(?:ws|events)(?:/|$) {
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://exchange_api;
        }

        location ~ ^/(?:docs(?:/.*)?|openapi\.json|api/docs(?:/.*)?|api/openapi\.json)$ {
            proxy_pass http://exchange_api;
        }

        location = /uploads {
            return 308 /uploads/;
        }

        location ^~ /uploads/ {
            alias /app/uploads/;
            autoindex off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
